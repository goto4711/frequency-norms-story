<style>
  :root{--paper:#f6f2ea;--ink:#1d1d1f;--near:#4C72B0;--far:#C4AD66;--basilect:#C44E52;--rule:#d9d2c4;

  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 70% 8%,#20242c 0%,#121317 60%);

  .card{max-width:420px;width:calc(100% - 40px);background:#14161b;border:1px solid #2c313a;border-radius:16px;

  h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin:0 0 8px;color:#fff}
  p.sub{color:#c7c3ba;font-size:14.5px;line-height:1.5;margin:0 0 22px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2c313a;background:#0f1115;color:#f2efe9;
    font-size:16px;font-family:var(--sans);outline:none}
  input:focus{border-color:var(--near)}
  button{margin-top:14px;width:100%;padding:13px 14px;border:0;border-radius:10px;cursor:pointer;
    font-size:15px;font-weight:700;font-family:var(--sans);color:#fff;
    background:linear-gradient(90deg,#3c63a6,#4C72B0)}
  button:hover{filter:brightness(1.08)}
  .err{color:#e79aa0;font-size:13.5px;min-height:18px;margin-top:12px}
  .note{color:#7f8a97;font-size:11.5px;margin-top:18px;line-height:1.5}
</style>

  async function keyFrom(pw){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

      const key=await keyFrom(pw);
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));

      document.open(); document.write(doc); document.close();
    }catch(_){ err.textContent="Incorrect password. Try again."; document.getElementById("pw").value=""; document.getElementById("pw").focus(); }
